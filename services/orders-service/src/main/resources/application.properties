server.port=8085

# HMAC-SHA256 signing key; override with an env var / secrets manager in production.
# JWT_SHARED_SECRET is the name the class AWS stack's task definitions use (deploy/aws/README.md).
jwt.secret=${JWT_SECRET:${JWT_SHARED_SECRET:change-this-development-only-secret-key-please-32bytes+}}
# Shared by the services that serve and call /internal/** (BR-02, contract C5): sent as the
# X-Internal-Token header. Set INTERNAL_API_TOKEN to a real secret outside development.
internal.api-token=${INTERNAL_API_TOKEN:change-this-development-only-internal-token}
jwt.expiration-ms=3600000

# Browsers drop Secure cookies over plain HTTP (except on localhost), so this is off while the
# app is served over HTTP. Set AUTH_COOKIE_SECURE=true once it's behind HTTPS.
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}

# The trading app's origin; a comma-separated list. HTTPS is how Docker and start-all.ps1 serve it (BR-02);
# plain http stays allowed for a developer running `ng serve` without --ssl.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:https://localhost:4200,http://localhost:4200}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lemarket}
# The restricted application account, not the owner: it can't change or delete audit records
# (database/schema/016_audit_lockdown.sql).
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lemarket_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme_app}

# Schema is hand-authored raw SQL (see database/schema); Hibernate must never generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Only expose health (DB liveness); show-details defaults to "never" so failures aren't detailed to anonymous callers.
management.endpoints.web.exposure.include=health

# Where prices come from: trading-service's /api/market/** (see libs/market-client's
# MarketDataClient). Docker Compose overrides this with the container hostname.
market.service.url=${MARKET_SERVICE_URL:http://localhost:8084}

# Where fills are settled: trading-service's /internal/holdings/** (see
# com.lemarketjames.holdings.client.HoldingsSettlementClient), called when an order is marked
# FILLED. The same service as above today, but a separate setting, since prices and settlement are
# separate interfaces.
holdings.service.url=${HOLDINGS_SERVICE_URL:http://localhost:8084}

# Enabled only by disposable E2E stacks; never expose execution controls by default.
lmj.execution.control-enabled=${LMJ_EXECUTION_CONTROL_ENABLED:false}

# Kafka broker for order events (contract C6). Only used when LMJ_EVENTS_PUBLISHER=kafka, which
# Docker Compose and Jenkins set; otherwise events are only logged and no broker is contacted (see
# com.lemarketjames.orders.messaging.OrderEventPublisher). Docker Compose overrides the address
# with the container hostname.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Events are sent on the thread that just committed the order. If the broker is down, give up
# after 5s (the default is 60s) so placing and executing orders isn't held up.
spring.kafka.producer.properties.max.block.ms=5000
