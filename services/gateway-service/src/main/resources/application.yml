# The trading gateway. The staff gateway is this same module started with the "staff" profile,
# which replaces the port, the CORS origin, the filters and the whole route list below
# (application-staff.yml).
server:
  port: 8080

# Upstream service locations. Docker Compose overrides these with container hostnames.
services:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8082}
  buy-sell-url: ${BUY_SELL_SERVICE_URL:http://localhost:8085}
  core-url: ${CORE_SERVICE_URL:http://localhost:8081}
  market-url: ${MARKET_SERVICE_URL:http://localhost:8083}
  holdings-url: ${HOLDINGS_SERVICE_URL:http://localhost:8084}
  # The two Kafka consumers clients read from. surveillance-service, the third, is for staff and
  # is known to the staff gateway only (application-staff.yml).
  notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
  activity-url: ${ACTIVITY_SERVICE_URL:http://localhost:8091}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # Browsers talk only to the gateway, so CORS is decided here once for every service.
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
                allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
                allowed-headers: "*"
                allow-credentials: true
          # Services also send CORS headers for direct local calls; keep a single copy.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          # Routes are checked in order: the specific auth route must stay before the core catch-all.
          # Add a route here whenever a feature is extracted into its own service.
          # /api/v1/reports/** gets no route of its own on purpose: reporting-service is reached
          # only through the staff gateway, so here those paths fall through to core-service.
          routes:
            - id: auth-service
              uri: ${services.auth-url}
              predicates:
                - Path=/api/auth/**
            - id: market-service
              uri: ${services.market-url}
              predicates:
                - Path=/api/market/**
            - id: holdings-service
              uri: ${services.holdings-url}
              predicates:
                - Path=/api/v1/holdings/**,/api/holdings/**,/api/v1/profile/**,/api/v1/portfolio/**,/api/balance/**,/api/v1/balance/**,/api/v1/trades/**
            - id: buy-sell-service
              uri: ${services.buy-sell-url}
              predicates:
                - Path=/api/v1/orders/**,/api/v1/buy-orders/**
            - id: notification-service
              uri: ${services.notification-url}
              predicates:
                - Path=/api/v1/notifications/**
            - id: activity-service
              uri: ${services.activity-url}
              predicates:
                - Path=/api/v1/market-activity/**
            - id: core-service
              uri: ${services.core-url}
              predicates:
                - Path=/api/**,/

# Only expose health so the smoke test can check the gateway is up.
management:
  endpoints:
    web:
      exposure:
        include: health
