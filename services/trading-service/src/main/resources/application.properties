server.port=8084

# HMAC-SHA256 signing key; must match every other service's JWT_SECRET so they accept tokens issued
# by auth-service.
# JWT_SHARED_SECRET is the name the class AWS stack's task definitions use (deploy/aws/README.md).
jwt.secret=${JWT_SECRET:${JWT_SHARED_SECRET:change-this-development-only-secret-key-please-32bytes+}}
# Shared by the services that serve and call /internal/** (BR-02, contract C5): sent as the
# X-Internal-Token header. Set INTERNAL_API_TOKEN to a real secret outside development.
internal.api-token=${INTERNAL_API_TOKEN:change-this-development-only-internal-token}
jwt.expiration-ms=3600000

# The trading app's origin; a comma-separated list. HTTPS is how Docker and start-all.ps1 serve it (BR-02);
# plain http stays allowed for a developer running `ng serve` without --ssl.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:https://localhost:4200,http://localhost:4200}

# Same shared database as every other service.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lemarket}
# The restricted application account, not the owner: it can't change or delete audit records
# (database/schema/016_audit_lockdown.sql).
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lemarket_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme_app}

# Schema is hand-authored raw SQL (see database/schema); Hibernate must never generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Only expose health (DB liveness); show-details defaults to "never" so failures aren't detailed to anonymous callers.
management.endpoints.web.exposure.include=health

# No market.service.url here on purpose: prices come from the simulator in this process
# (com.lemarketjames.market.inprocess). Setting it would switch on market-client's HTTP clients
# as second MarketDataService and PriceHistoryService beans.

# orders-service base URL (see com.lemarketjames.orders.client.OrdersClient): this service only
# reads orders for trade history and buying power.
orders.service.url=${ORDERS_SERVICE_URL:http://localhost:8085}

# Market simulation settings: what each one means is documented once, in
# com.lemarketjames.market.config.MarketSimulationProperties. These lines exist only to give the
# dashed keys readable environment variable names (Spring's own mapping drops dashes, e.g.
# SIM_TICKMS); keep their defaults equal to the class's. Keys without dashes (sim.holidays,
# sim.control.enabled) need no line here: SIM_HOLIDAYS and SIM_CONTROL_ENABLED already work.
sim.enabled=${SIM_ENABLED:true}
sim.tick-ms=${SIM_TICK_MS:1000}
sim.seed=${SIM_SEED:}
sim.speed-multiplier=${SIM_SPEED_MULTIPLIER:1}
sim.snapshot-interval-ms=${SIM_SNAPSHOT_INTERVAL_MS:5000}
sim.respect-market-hours=${SIM_RESPECT_MARKET_HOURS:true}
sim.catch-up-on-start=${SIM_CATCH_UP_ON_START:true}

# Kafka broker the order events are read from (contract C6), by the notification and market
# activity listeners. Only contacted when LMJ_EVENTS_CONSUMER=kafka, which Docker Compose sets;
# otherwise this service starts no listener (see
# com.lemarketjames.common.events.OrderEventConsumerSwitch). Docker Compose overrides the address
# with the container hostname.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Publishing starts as soon as orders-service is up, which can be before this service has
# joined its consumer groups. Starting a new group at the oldest record means none of those early
# events is missed; from then on each group continues from its own committed position.
spring.kafka.consumer.auto-offset-reset=earliest
