server.port=8084

jwt.secret=test-only-secret-key-not-used-in-production-32bytes+
jwt.expiration-ms=3600000

app.cors.allowed-origin=http://localhost:4200

# orders-service is mocked or unreached in tests; this URL is never called. There is no
# market.service.url: prices come from the simulator in this process, or a mocked MarketDataService.
orders.service.url=http://localhost:8085

# H2 in Postgres compatibility mode, so tests don't require a Docker-hosted Postgres instance.
# Schema is generated from the JPA entities here (test-only); real environments use the
# hand-authored SQL in database/schema with spring.jpa.hibernate.ddl-auto=validate.
spring.datasource.url=jdbc:h2:mem:tradingtestdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Run src/test/resources/schema.sql and data.sql (test instruments) after Hibernate creates the
# tables, so orders/holdings/quotes tests have real instruments to reference.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# No ticking in tests: a test that needs prices sets them itself or mocks MarketDataService.
sim.enabled=false

# A test that switches a listener on (lmj.events.consumer=kafka) gets the bean but no running
# consumer, so no test contacts a broker; it hands records to the listener method itself.
spring.kafka.listener.auto-startup=false
