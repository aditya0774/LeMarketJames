server.port=8083

# Same shared database as every other service.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lemarket}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lemarket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}

# Schema is hand-authored raw SQL (see database/schema); Hibernate must never generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Only expose health (DB liveness); show-details defaults to "never" so failures aren't detailed to anonymous callers.
management.endpoints.web.exposure.include=health

# Market simulation (com.lemarketjames.market). Prices follow Geometric Brownian Motion using the
# per-instrument settings in instrument_market_params (database/schema/006_market_simulation.sql).
# Whether prices tick automatically.
sim.enabled=${SIM_ENABLED:true}
# Milliseconds between price ticks.
sim.tick-ms=${SIM_TICK_MS:1000}
# Fixed random seed to replay the same market; leave empty for a different market on each run.
sim.seed=${SIM_SEED:}
# Simulated seconds per real second (1 = real time; larger values make prices move faster for demos).
sim.speed-multiplier=${SIM_SPEED_MULTIPLIER:1}
# Milliseconds between saving latest prices and 1-minute candles to the database.
sim.snapshot-interval-ms=${SIM_SNAPSHOT_INTERVAL_MS:5000}
# Only move prices while each exchange is open (US equities: 09:30-16:00 New York, weekdays).
# Set SIM_RESPECT_MARKET_HOURS=false to see prices move outside market hours during development.
sim.respect-market-hours=${SIM_RESPECT_MARKET_HOURS:true}
