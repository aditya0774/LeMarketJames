# Unit tests' settings, layered over the real src/main/resources/application.properties. Named
# for the "default" profile so they apply only when no profile is chosen: with
# -Dspring.profiles.active=postgres-test (Jenkins' integration stage) the service keeps its real
# configuration, read-side limits included, and application-postgres-test.properties only points
# it at another database.

jwt.secret=test-only-secret-key-not-used-in-production-32bytes+

# H2 in Postgres compatibility mode, so tests don't require a Docker-hosted Postgres instance.
# Schema is generated from the JPA entities here (test-only); real environments use the
# hand-authored SQL in database/schema with spring.jpa.hibernate.ddl-auto=validate.
spring.datasource.url=jdbc:h2:mem:staffops;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# H2 has neither PostgreSQL setting the reports' pool sets on each connection; the read-only and
# timeout limits are checked against PostgreSQL by ReadSideSafeguardsIntegrationTest instead.
reporting.datasource.hikari.connection-init-sql=

# A test that switches a listener on (lmj.events.consumer=kafka) gets the bean but no running
# consumer, so no test contacts a broker; it hands records to the listener method itself.
spring.kafka.listener.auto-startup=false

# No overnight scheduler in tests: its startup catch-up would write report runs into the test
# database. OvernightRunsIntegrationTest drives the run writer itself, against PostgreSQL.
reporting.overnight.enabled=false
