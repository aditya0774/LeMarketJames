server.port=8086

# HMAC-SHA256 signing key; override with an env var / secrets manager in production.
# This service only validates tokens (auth-service issues them), but JwtService needs both values.
jwt.secret=${JWT_SECRET:change-this-development-only-secret-key-please-32bytes+}
jwt.expiration-ms=3600000

# The one database and account both pools below connect with.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lemarket}
# The restricted application account, not the owner: it can't change or delete audit records
# (database/schema/016_audit_lockdown.sql).
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lemarket_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme_app}

# Schema is hand-authored raw SQL (see database/schema); Hibernate must never generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The ordinary pool (com.lemarketjames.config.PrimaryDataSourceConfig): surveillance stores one
# alert at a time and the JWT filter reads one account, so a few connections are plenty.
spring.datasource.hikari.maximum-pool-size=3

# Only expose health (DB liveness); show-details defaults to "never" so failures aren't detailed to anonymous callers.
management.endpoints.web.exposure.include=health

# --- Read-side safeguards: reports share the database with live trading and must not starve it ---
# The reports' own pool (com.lemarketjames.config.ReportingDataSourceConfig), checked against a
# real database by ReadSideSafeguardsIntegrationTest.
reporting.datasource.hikari.pool-name=reporting
# A small pool: however many reports are requested at once, this is the most connections they hold.
# One, because a report query is CPU-bound in PostgreSQL: each busy connection takes a whole core
# from order execution. With 3, the LMKT-44 load test (apps/e2e/load) saw p95 time to FILLED rise
# from 1.6 s to 2.3 s on a 4-core host; with 1 it stayed on target, and reports queue instead
# (still within BR-16's 5-10 s with 8 analysts requesting nonstop). Raise it only on a host with
# cores to spare, and re-run the load test when you do.
reporting.datasource.hikari.maximum-pool-size=${REPORTING_DB_POOL_SIZE:1}
# Run on every connection the pool opens, so both limits are the database's and no query can skip them:
# - default_transaction_read_only: every transaction is read-only; a write is refused by PostgreSQL.
# - statement_timeout (ms): PostgreSQL cancels a query that runs longer, freeing its locks and CPU.
reporting.datasource.hikari.connection-init-sql=SET default_transaction_read_only = on; SET statement_timeout = ${REPORTING_QUERY_TIMEOUT_MS:5000}

# --- Overnight reports (LMKT-45; README, "Overnight reports") ---
# When they run and when they must be ready by are business settings: lmj.reports.* (contract C5).
# Switches the overnight scheduler on or off for this instance.
reporting.overnight.enabled=${REPORTING_OVERNIGHT_ENABLED:true}
# Makes the overnight job (Monthly trading summary) fail with this message, to show a failed run on a
# running stack. Blank: it runs.
reporting.overnight.fail-with=${REPORTING_OVERNIGHT_FAILWITH:}
# Statement timeout (ms) of the overnight summary refresh's own transaction, in place of the 5 s
# daytime limit above: its first night summarizes all history. It runs outside trading hours.
reporting.overnight.statement-timeout-ms=${REPORTING_OVERNIGHT_QUERY_TIMEOUT_MS:300000}
# Two scheduler threads: one runs the night's reports, so the ready-by check is never stuck behind a long run.
spring.task.scheduling.pool.size=2

# Kafka broker the order events are read from (contract C6), by the surveillance listeners. Only
# contacted when LMJ_EVENTS_CONSUMER=kafka, which Docker Compose sets; otherwise this service
# starts no listener (see com.lemarketjames.common.events.OrderEventConsumerSwitch). Docker
# Compose overrides the address with the container hostname.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Publishing starts as soon as orders-service is up, which can be before this service has
# joined its consumer group. Starting a new group at the oldest record means none of those early
# events is missed; from then on the group continues from its own committed position.
spring.kafka.consumer.auto-offset-reset=earliest
