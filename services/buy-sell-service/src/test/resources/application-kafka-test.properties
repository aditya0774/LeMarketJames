# Publishes order events to a real Kafka broker instead of the stub (contract C6). The broker is the
# "kafka" service in docker-compose.yml, which Jenkins starts before the integration tests; locally,
# `docker compose up -d kafka`. Combine with postgres-test or run on its own (H2).
lmj.events.publisher=kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Fail a send quickly when the broker isn't there, so a missing broker shows as a failed test, not a hang.
spring.kafka.producer.properties.max.block.ms=5000
