server.port=8085

jwt.secret=test-only-secret-key-not-used-in-production-32bytes+
jwt.expiration-ms=3600000

app.cors.allowed-origin=http://localhost:4200

# holdings-service is mocked in tests (see @MockBean HoldingsSettlementClient/HoldingsValidationClient),
# so this URL is never called.
holdings.service.url=http://localhost:8084

# H2 in Postgres compatibility mode, so tests don't require a Docker-hosted Postgres instance.
# Schema is generated from the JPA entities here (test-only); real environments use the
# hand-authored SQL in database/schema with spring.jpa.hibernate.ddl-auto=validate.
spring.datasource.url=jdbc:h2:mem:buysellservicetestdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Run src/test/resources/data.sql (test instruments) after Hibernate creates the tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
