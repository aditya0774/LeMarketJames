server.port=8084

# HMAC-SHA256 signing key; must match every other service's JWT_SECRET so they accept tokens issued
# by auth-service. Needed here (unlike market-service) because this service's endpoints are
# user-facing through the gateway.
jwt.secret=${JWT_SECRET:change-this-development-only-secret-key-please-32bytes+}
jwt.expiration-ms=3600000

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Same shared database as every other service.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lemarket}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lemarket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}

# Schema is hand-authored raw SQL (see database/schema); Hibernate must never generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Only expose health (DB liveness); show-details defaults to "never" so failures aren't detailed to anonymous callers.
management.endpoints.web.exposure.include=health

# market-service base URL (see libs/market-client's MarketDataClient). Docker Compose overrides
# this with the container hostname.
market.service.url=${MARKET_SERVICE_URL:http://localhost:8083}

# core-service base URL (see com.lemarketjames.orders.client.OrdersClient) — order placement stays
# in core-service; this service only reads orders for trade history and buying power.
orders.service.url=${ORDERS_SERVICE_URL:http://localhost:8081}
