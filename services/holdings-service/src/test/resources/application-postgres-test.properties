# Run only against the disposable testing database, never a production database.
spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/lemarket}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${TEST_DATABASE_USER:lemarket}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
# Compose owns schema/seed initialization; do not reinsert the H2 data.sql fixtures.
spring.sql.init.mode=never
