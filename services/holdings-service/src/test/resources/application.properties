server.port=8084

jwt.secret=test-only-secret-key-not-used-in-production-32bytes+
jwt.expiration-ms=3600000

app.cors.allowed-origin=http://localhost:4200

# market-service/core-service are mocked or unreached in tests; these URLs are never called.
market.service.url=http://localhost:8083
orders.service.url=http://localhost:8081

# H2 in Postgres compatibility mode, so tests don't require a Docker-hosted Postgres instance.
# Schema is generated from the JPA entities here (test-only); real environments use the
# hand-authored SQL in database/schema with spring.jpa.hibernate.ddl-auto=validate.
spring.datasource.url=jdbc:h2:mem:holdingstestdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# This service has no Instrument JPA entity (that stays in core-service), but
# HoldingsOwnDataIntegrationTest needs a real instruments row to satisfy holdings.instrument_id's
# FK on real Postgres. schema.sql creates a matching table for the H2 test profile too; the test
# itself inserts its own row via JdbcTemplate either way.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
