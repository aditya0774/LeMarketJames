# Run only against the disposable testing database, never a production database.
spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/lemarket}
spring.datasource.driver-class-name=org.postgresql.Driver
# The restricted application account (database/schema/016_audit_lockdown.sql), so these tests
# run with the rights the services have.
spring.datasource.username=${TEST_DATABASE_USER:lemarket_app}
spring.datasource.password=${TEST_DATABASE_PASSWORD:${APP_DB_PASSWORD:changeme_app}}
spring.jpa.hibernate.ddl-auto=validate

# For PostgreSQL tests: the database already has its schema (via migrations in Jenkinsfile).
# Don't auto-run SQL scripts; they can cause FK constraint errors during initialization.
# Tests create their own data via @BeforeEach methods (e.g., OwnDataIntegrationTest.seedTwoUsers).
spring.sql.init.mode=never

# Defer datasource initialization: ensures consistency with H2 tests if we ever add SQL scripts back.
spring.jpa.defer-datasource-initialization=true
