server.port=8088

# HMAC-SHA256 signing key; override with an env var / secrets manager in production.
# This service only validates tokens (auth-service issues them), but JwtService needs both values.
jwt.secret=${JWT_SECRET:change-this-development-only-secret-key-please-32bytes+}
jwt.expiration-ms=3600000

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lemarket}
# The restricted application account, not the owner: it can't change or delete audit records
# (database/schema/016_audit_lockdown.sql).
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lemarket_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme_app}

# Schema is hand-authored raw SQL (see database/schema); Hibernate must never generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Only expose health (DB liveness); show-details defaults to "never" so failures aren't detailed to anonymous callers.
management.endpoints.web.exposure.include=health

# Kafka broker the order events are read from (contract C6). Only contacted when
# LMJ_EVENTS_CONSUMER=kafka, which Docker Compose sets; otherwise this service starts no listener
# (see com.lemarketjames.common.events.OrderEventConsumerSwitch). Docker Compose overrides the
# address with the container hostname.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Publishing starts as soon as buy-sell-service is up, which can be before this service has
# joined its consumer group. Starting a new group at the oldest record means none of those early
# events is missed; from then on the group continues from its own committed position.
spring.kafka.consumer.auto-offset-reset=earliest
