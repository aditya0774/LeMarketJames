# SonarQube analysis of the whole monorepo as one project. Read by the SonarScanner that the
# Jenkinsfile's "SonarQube Analysis" stage runs from the repo root. The server address and the
# token come from Jenkins (withSonarQubeEnv); never put either in this file.

# Assigned by the instructor (SonarQube Classroom Setup guide); the key must match the server.
sonar.projectKey=LeMarketJames-Project
sonar.projectName=LeMarketJames-Project
sonar.sourceEncoding=UTF-8

# Listed folder by folder rather than ".", so that generated Javadoc and coverage pages under
# docs/ and the Maven and npm caches Jenkins keeps in its workspace are never analysed.
sonar.sources=apps/frontend,libs,services,database,scripts,docker-compose.yml,Jenkinsfile,pom.xml
sonar.tests=apps/e2e,apps/frontend,libs,services
sonar.test.inclusions=apps/e2e/**,**/src/test/**,**/*.spec.ts,**/*.testing.ts

# Build output, plus the test files above: a file may be a source or a test, not both.
sonar.exclusions=\
**/node_modules/**,\
**/target/**,\
**/dist/**,\
**/coverage/**,\
**/.angular/**,\
**/src/test/**,\
**/*.spec.ts,\
**/*.testing.ts
sonar.test.exclusions=\
**/node_modules/**,\
apps/e2e/test-results*/**,\
apps/e2e/playwright-report*/**,\
apps/e2e/results/**

# Java: the scanner reads compiled classes, so the Maven build must run first.
sonar.java.source=21
sonar.java.binaries=libs/*/target/classes,services/*/target/classes
sonar.java.test.binaries=libs/*/target/test-classes,services/*/target/test-classes
# Test results (counts and skipped tests) from every Maven module.
sonar.junit.reportPaths=\
libs/common/target/surefire-reports,\
libs/market-client/target/surefire-reports,\
services/activity-service/target/surefire-reports,\
services/auth-service/target/surefire-reports,\
services/buy-sell-service/target/surefire-reports,\
services/core-service/target/surefire-reports,\
services/gateway-service/target/surefire-reports,\
services/holdings-service/target/surefire-reports,\
services/market-service/target/surefire-reports,\
services/notification-service/target/surefire-reports,\
services/reporting-service/target/surefire-reports,\
services/staff-gateway-service/target/surefire-reports,\
services/surveillance-service/target/surefire-reports

# Coverage of both sides in one report, written by scripts/coverage/build-sonar-coverage.mjs
# (that script explains why the JaCoCo and lcov reports are not listed here directly).
sonar.coverageReportPaths=target/sonar/coverage.xml
# CI and local tooling that no unit test runs; without this it would count as 0% covered.
sonar.coverage.exclusions=scripts/**
