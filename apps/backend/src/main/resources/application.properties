server.port=8081

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/lemarketjames
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# HMAC-SHA256 signing key; override with an env var / secrets manager in production.
jwt.secret=${JWT_SECRET:change-this-development-only-secret-key-please-32bytes+}
jwt.expiration-ms=3600000

# Duration a username is locked out for after 3 consecutive failed login attempts.
auth.lockout-duration-ms=30000

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
