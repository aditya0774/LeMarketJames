server.port=8081

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# HMAC-SHA256 signing key; override with an env var / secrets manager in production.
jwt.secret=${JWT_SECRET:change-this-development-only-secret-key-please-32bytes+}
jwt.expiration-ms=3600000

# Duration a username is locked out for after 3 consecutive failed login attempts.
auth.lockout-duration-ms=30000

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
