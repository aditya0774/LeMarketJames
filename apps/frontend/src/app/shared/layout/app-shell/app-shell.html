<div class="app-shell">
  <!-- The redesign's header: brand on the left, the section tabs in the middle, the account menu
       on the right. The current tab is marked with aria-current, not colour alone. -->
  <header class="app-head">
    <app-brand class="app-head-brand" link="/dashboard" />

    <nav class="seg tabs app-tabs" aria-label="Main">
      <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Overview</a>
      <a routerLink="/market" routerLinkActive="active" ariaCurrentWhenActive="page">Market</a>
      <a routerLink="/holdings" routerLinkActive="active" ariaCurrentWhenActive="page">Holdings</a>
      <a routerLink="/orders" routerLinkActive="active" ariaCurrentWhenActive="page">Orders</a>
    </nav>

    <div class="app-head-end">
      <a class="btn btn-primary trade-btn" routerLink="/trade" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        Trade
      </a>
      <lm-account-menu [name]="auth.currentUser() ?? ''" detail="Investing account" (loggedOut)="logout()" />
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
