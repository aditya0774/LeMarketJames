<div class="app-shell">
  <!-- The redesign's header: brand on the left, the section tabs in the middle, the account menu
       on the right. The current tab is marked with aria-current, not colour alone. -->
  <header class="app-head">
    <app-brand class="app-head-brand" link="/dashboard" />

    <nav class="seg tabs app-tabs" aria-label="Main">
      <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Overview</a>
      <a routerLink="/holdings" routerLinkActive="active" ariaCurrentWhenActive="page">Holdings</a>
    </nav>

    <div class="app-head-end">
      <app-account-menu [name]="auth.currentUser() ?? ''" detail="Investing account" (loggedOut)="logout()" />
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
