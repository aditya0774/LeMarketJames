<header class="app-header">
  <div>
    <h1>Dashboard</h1>
    <div class="sub">Welcome back, {{ auth.currentUser() }} — here's where things stand.</div>
  </div>
</header>

@if (sessionExpired()) {
  <div class="alert err" role="alert">
    <div>
      <b>401 · Unauthorized</b>
      Your session has expired — please <a routerLink="/login">log in again</a> to continue.
    </div>
  </div>
}

<app-stat-strip [totals]="totals()" [openOrders]="openOrders()" [buyingPower]="balanceData()?.buyingPower ?? null" />

<div class="dash-grid">
  <app-market-list [rows]="marketRows()" (selectSymbol)="openTrade($event)" />

  <app-portfolio-panel
    [holdings]="holdings()"
    [loading]="holdingsLoading()"
    [error]="holdingsError()"
    (selectSymbol)="openTrade($event)"
  />
</div>

<app-orders-panel
  [orders]="historyOrders()"
  (dateChange)="onHistoryDateChange($event)"
  (pageChange)="onHistoryPageChange($event)"
  [loading]="ordersLoading()"
  [error]="ordersError()"
  [liveConnection]="ordersConnection()"
  [serverPagination]="true"
  [currentPage]="historyPage()"
  [hasNextPage]="historyHasNext()"
  [totalOrders]="historyTotal()"
/>

@if (tradeSymbol(); as symbol) {
  <app-trade-dialog
    [symbol]="symbol"
    [initialHistory]="marketHistory()[symbol] ?? []"
    (closed)="closeTrade()"
    (orderPlaced)="onOrderPlaced()"
  />
}
