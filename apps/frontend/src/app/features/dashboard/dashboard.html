<header class="app-header">
  <div>
    <h1>Dashboard</h1>
    <div class="sub">Welcome back, {{ auth.currentUser() }} — here's where things stand.</div>
  </div>
  <div class="header-actions">
    <button type="button" class="btn btn-outline" (click)="logout()">Log out</button>
  </div>
</header>

@if (sessionExpired()) {
  <div class="alert err" role="alert">
    <div>
      <b>401 · Unauthorized</b>
      Your session has expired — please <a routerLink="/login">log in again</a> to continue.
    </div>
  </div>
}

<app-stock-search />

<app-stat-strip [totals]="totals()" [openOrders]="openOrders()" />

<app-portfolio-panel
  [holdings]="holdings()"
  [loading]="holdingsLoading()"
  [error]="holdingsError()"
  (selectSymbol)="openTrade($event)"
/>

<app-orders-panel [orders]="orders()" [loading]="ordersLoading()" [error]="ordersError()" />
