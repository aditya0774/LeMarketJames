<!-- The page heading is for screen readers and tests; the tab bar already says where you are. -->
<h1 class="sr-only">Dashboard</h1>
<p class="greeting">Welcome back, {{ auth.currentUser() }} — here's where your money stands today.</p>

@if (sessionExpired()) {
  <app-session-expired />
}

<div class="overview">
  <app-stat-strip
    class="ov-stats"
    [totals]="totals()"
    [openOrders]="accountOrders.openCount()"
    [buyingPower]="balance()?.buyingPower ?? null"
    (moveMoney)="moneyDialog.set($event)"
  />

  <app-portfolio-chart class="ov-chart" [refreshKey]="accountVersion()" />

  <app-quick-trade
    class="ov-trade"
    [instruments]="instruments()"
    [quotes]="marketQuotes()"
    [holdings]="heldBySymbol()"
    [buyingPower]="balance()?.buyingPower ?? null"
    [symbol]="quickSymbol()"
    (symbolChange)="chooseSymbol($event)"
    (orderPlaced)="onOrderPlaced()"
  />

  <app-holdings-split
    class="ov-split"
    [holdings]="liveHoldings()"
    [loading]="holdingsLoading()"
    [error]="holdingsError()"
    (selectSymbol)="chooseSymbol($event)"
  />

  <app-movers class="ov-movers" [quotes]="marketQuotes()" [history]="marketHistory()" (selectSymbol)="chooseSymbol($event)" />
</div>

@if (moneyDialog(); as kind) {
  <app-move-money
    [start]="kind"
    [buyingPower]="balance()?.buyingPower ?? null"
    (moved)="onMoneyMoved($event)"
    (closed)="moneyDialog.set(null)"
  />
}
