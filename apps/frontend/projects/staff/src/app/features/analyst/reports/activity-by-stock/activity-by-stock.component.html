<div class="activity-by-stock-container">
  <div class="report-header">
    <h1>Trading Activity by Stock</h1>
    <p class="description">Aggregate trading activity across all clients, grouped by stock symbol.</p>
  </div>

  <!-- Date Range Filters -->
  <mat-card class="filter-card">
    <mat-card-content>
      <form [formGroup]="dateRangeForm" class="date-range-form">
        <div class="date-fields">
          <mat-form-field appearance="outline">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="startPicker" formControlName="startDate" (change)="onDateRangeChange()" />
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="endPicker" formControlName="endDate" (change)="onDateRangeChange()" />
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
          </mat-form-field>
        </div>

        <button mat-raised-button color="primary" type="button" (click)="onDateRangeChange()" [disabled]="isLoading()">
          Refresh
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="loading-state">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading report...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error() && !isLoading()" class="error-state">
    <mat-card>
      <mat-card-content>
        <h2>Unable to Load Report</h2>
        <p>{{ error() }}</p>
        <button mat-raised-button color="primary" (click)="onRetry()">
          Try Again
        </button>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Table -->
  <div *ngIf="!isLoading() && !error()" class="table-container">
    <staff-by-stock-aggregate-table [tradesData]="tradesData()"></staff-by-stock-aggregate-table>
  </div>
</div>
