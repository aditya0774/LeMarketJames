<div class="activity-by-stock-container">
  <div class="report-bar">
    <p class="report-note">All clients combined · select a column to sort</p>
    <form [formGroup]="dateRangeForm" class="report-dates">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Start date</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="startDate" (change)="onDateRangeChange()" />
        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>End date</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="endDate" (change)="onDateRangeChange()" />
        <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>
      <button type="button" class="btn btn-primary" (click)="onDateRangeChange()" [disabled]="isLoading()">Refresh</button>
    </form>
  </div>

  @if (isLoading()) {
    <output class="card loading"><span class="spinner"></span>Loading report…</output>
  } @else if (error()) {
    <div class="card error-state">
      <h2>Unable to Load Report</h2>
      <p>{{ error() }}</p>
      <button type="button" class="btn btn-outline" (click)="onRetry()">Try Again</button>
    </div>
  } @else {
    <div class="card table-container">
      <staff-by-stock-aggregate-table [tradesData]="tradesData()" />
    </div>
  }
</div>
