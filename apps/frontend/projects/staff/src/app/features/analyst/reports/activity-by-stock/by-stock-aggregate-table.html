<div class="trades-by-stock-aggregate-table">
  @if (tradesData().length === 0) {
    <div class="empty-state">
      <p>No trading activity for the selected date range.</p>
    </div>
  } @else {
    <table class="t aggregate-table" aria-label="Activity by stock">
      <thead>
        <!-- Each sortable header is a button, so sorting works from the keyboard too. -->
        <tr>
          <th scope="col" class="sortable" [attr.aria-sort]="ariaSort('symbol')">
            <button type="button" (click)="toggleSort('symbol')">Stock {{ getSortIndicator('symbol') }}</button>
          </th>
          <th scope="col" class="sortable r" [attr.aria-sort]="ariaSort('totalQuantity')">
            <button type="button" (click)="toggleSort('totalQuantity')">Shares traded {{ getSortIndicator('totalQuantity') }}</button>
          </th>
          <th scope="col" class="sortable r" [attr.aria-sort]="ariaSort('totalGrossAmount')">
            <button type="button" (click)="toggleSort('totalGrossAmount')">Gross amount {{ getSortIndicator('totalGrossAmount') }}</button>
          </th>
          <th scope="col" class="bar-col"><span class="sr-only">Share of total</span></th>
          <th scope="col" class="sortable r" [attr.aria-sort]="ariaSort('buyCount')">
            <button type="button" (click)="toggleSort('buyCount')">Buys {{ getSortIndicator('buyCount') }}</button>
          </th>
          <th scope="col" class="sortable r" [attr.aria-sort]="ariaSort('sellCount')">
            <button type="button" (click)="toggleSort('sellCount')">Sells {{ getSortIndicator('sellCount') }}</button>
          </th>
        </tr>
      </thead>
      <tbody>
        @for (row of sortedData(); track row.symbol) {
          <tr class="trade-row">
            <td class="symbol sym">{{ row.symbol }}</td>
            <td class="r mono">{{ row.totalQuantity | number: '1.0-0' }}</td>
            <td class="r mono">{{ row.totalGrossAmount | currency }}</td>
            <td class="bar-col"><span class="bar" aria-hidden="true" [style.width.%]="barWidth(row.totalGrossAmount)"></span></td>
            <td class="r mono">{{ row.buyCount }}</td>
            <td class="r mono">{{ row.sellCount }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
