<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Courtside View · lemarket</title>
    <base href="/" />
    <!-- Apply the saved colour theme before the styles paint, so a light-theme user never sees
         a dark flash. Theme (projects/shared-ui) takes over once Angular starts. -->
    <script>
      try {
        if (localStorage.getItem('lemarket-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch {
        // Storage blocked (private window, site data off): stay on the dark default.
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <staff-root></staff-root>
  </body>
</html>
