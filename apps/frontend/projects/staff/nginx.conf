# The staff app's Nginx: serves the built staff app and forwards the few /api paths staff use to
# the backend services, so the browser only ever calls its own origin. It does what the staff
# gateway used to do (contracts/C6-api.md, "Which web app routes which paths"; contracts/C7-roles.md,
# "The staff session cookie"); the dev server does the same in staff-proxy.mjs. Keep them in step.
#
# - Only the listed paths exist. Anything else under /api answers 404; each service still checks
#   the caller's role itself.
# - Staff hold their own session cookie, staff_jwt, so a staff and a customer session can share a
#   browser (browsers share cookies across the ports of one host). The services only know jwt:
#   on the way in, the staff cookie is sent as jwt and any customer jwt is dropped; on the way
#   out, the jwt cookie set by sign-in, sign-out and session refresh is renamed to staff_jwt.
# - Origin is not passed on. The services accept only the trading app's origin and would refuse
#   every staff POST (sign-in, sign-out) with 403; the staff app calls its own origin, so CORS
#   has nothing to decide here.

# The only cookie the services read, made from the browser's staff cookie. Without one, the
# services see no cookie at all.
map $cookie_staff_jwt $staff_service_cookie {
    ""      "";
    default "jwt=$cookie_staff_jwt";
}

# Sign-in, sign-out and refresh answer with exactly one Set-Cookie, the service's jwt; it reaches
# the browser as staff_jwt with every attribute kept.
map $upstream_http_set_cookie $staff_set_cookie {
    "~^jwt=(?<staff_cookie_rest>.*)$" "staff_jwt=$staff_cookie_rest";
    default                          $upstream_http_set_cookie;
}

server {
    # HTTPS only (BR-02): the certificate is self-signed, made when the image is built (Dockerfile),
    # so a browser warns once. A plain-HTTP request to this port is sent to the same address over HTTPS.
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    error_page 497 =301 https://$http_host$request_uri;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's own DNS, re-asked every 10s. The upstreams are variables so that Nginx looks them up
    # per request: it starts even while a service is still down, and follows a restarted container.
    resolver 127.0.0.11 valid=10s;
    set $auth_service http://auth-service:8082;
    set $orders_service http://orders-service:8085;
    set $staff_ops_service http://staff-ops-service:8086;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
    proxy_set_header Cookie $staff_service_cookie;

    # Analyst reports and Trading Ops' surveillance alerts.
    location /api/v1/reports/ {
        proxy_pass $staff_ops_service;
    }
    location /api/v1/surveillance/ {
        proxy_pass $staff_ops_service;
    }

    # Sign-in, sign-out, "who am I" and keeping an active session going (BR-03 inactivity timeout).
    # No registration: staff logins are not self-service.
    location ~ ^/api/auth/(login|logout|me|refresh)$ {
        proxy_pass $auth_service;
        proxy_hide_header Set-Cookie;
        add_header Set-Cookie $staff_set_cookie always;
    }

    # The Trading Ops reads: trade search, its client list and an order's timeline.
    location ~ ^/api/v1/orders/(trades/search|trades/clients|[^/]+/timeline)$ {
        proxy_pass $orders_service;
    }

    # Archived audit events, for Risk and Compliance through Trading Ops (BR-14).
    location = /api/v1/audit/archive {
        proxy_pass $orders_service;
    }

    # Trading Ops' view and change of a client's account status, with its history (BR-03).
    location ~ ^/api/v1/clients/[0-9]+/status$ {
        proxy_pass $auth_service;
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
