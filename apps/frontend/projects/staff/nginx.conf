server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep authenticated API requests on the browser's origin. They go to the staff gateway
    # (LMKT-143), never to the trading gateway.
    location /api/ {
        # The gateway's name is looked up per request, through Docker's DNS, instead of at
        # startup: Nginx refuses to start when a fixed upstream doesn't resolve, and the staff
        # gateway doesn't exist yet. Until it does, /api answers 502.
        resolver 127.0.0.11 valid=10s;
        set $staff_gateway http://staff-gateway-service:8090;
        proxy_pass $staff_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Angular client-side routing: serve index.html for any unmatched path.
        try_files $uri $uri/ /index.html;
    }
}
