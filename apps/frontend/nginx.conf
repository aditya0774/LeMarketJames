# The trading app's Nginx: serves the built Angular app and forwards /api to the backend services,
# so the browser only ever calls its own origin. It does the routing a gateway used to do; the
# paths each service serves are listed in contracts/C6-api.md ("Which web app routes which paths"),
# and the dev server does the same in proxy.conf.json. Keep the three in step.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's own DNS, re-asked every 10s. The upstreams are variables so that Nginx looks them up
    # per request: it starts even while a service is still down, and follows a restarted container.
    resolver 127.0.0.11 valid=10s;
    set $auth_service http://auth-service:8082;
    set $orders_service http://orders-service:8085;
    set $trading_service http://trading-service:8084;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Registration, sign-in, sign-out and "who am I".
    location /api/auth/ {
        proxy_pass $auth_service;
    }

    # Orders, including the live order-status stream (server-sent events): unbuffered and kept open,
    # so each status change reaches the browser when it happens.
    location ~ ^/api/v1/(orders|buy-orders)(/|$) {
        proxy_pass $orders_service;
        proxy_http_version 1.1;
        # A location with proxy_set_header of its own inherits none from the server, so all three.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # The live portfolio stream (server-sent events, LMKT-28): unbuffered and kept open like the order
    # stream, so a settlement reaches the browser at once. The /api/ catch-all below would buffer it.
    location = /api/v1/portfolio/stream {
        proxy_pass $trading_service;
        proxy_http_version 1.1;
        # A location with proxy_set_header of its own inherits none from the server, so all three.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Everything else a client reads: quotes, instruments, sessions, the market, profile, holdings,
    # portfolio, trade history, notifications and market activity. Staff paths (reports,
    # surveillance) are not routed here; the staff app serves them.
    location /api/ {
        proxy_pass $trading_service;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
