server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep authenticated API requests on the browser's origin.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Angular client-side routing: serve index.html for any unmatched path.
        try_files $uri $uri/ /index.html;
    }
}
