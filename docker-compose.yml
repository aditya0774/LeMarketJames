services:
  # The trading app. Its Nginx serves the app and forwards /api to auth-, orders- and
  # trading-service by path (apps/frontend/nginx.conf), so the browser only calls its own origin.
  frontend:
    image: lemarketjames/frontend:${IMAGE_TAG:-dev}
    build: ./apps/frontend
    ports:
      # HTTPS only, with a self-signed certificate (BR-02): browsers warn once for localhost.
      - "4200:443"
    depends_on:
      - auth-service
      - orders-service
      - trading-service

  # The staff app (Trading Ops and Analyst): a separate Angular app on its own port. It builds from
  # the same Angular workspace as the trading frontend, hence the shared context. Its Nginx
  # forwards only the staff paths, to auth-, orders- and staff-ops-service, and gives staff their
  # own session cookie, staff_jwt (apps/frontend/projects/staff/nginx.conf, contracts/C7-roles.md),
  # so a staff and a customer session can share a browser.
  staff-frontend:
    image: lemarketjames/staff-frontend:${IMAGE_TAG:-dev}
    build:
      context: ./apps/frontend
      dockerfile: projects/staff/Dockerfile
    ports:
      # HTTPS only, like the trading app.
      - "4201:443"
    depends_on:
      - auth-service
      - orders-service
      - staff-ops-service

  # Every service shares the same database and the same JWT_SECRET, so a token issued by
  # auth-service is accepted by the others.
  auth-service:
    image: lemarketjames/auth-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      # Published for direct debugging only; browser traffic goes through a web app.
      # This machine only (BR-02): another computer can't reach it. A shared VM that other machines
      # develop against sets SERVICE_BIND_ADDRESS=0.0.0.0 (README, "Running the Frontend Against a Remote Backend").
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:8082:8082"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development defaults for the disposable testing stack; environment overrides remain supported.
      # Every service logs in as lemarket_app, the restricted account that can't change or delete
      # audit records (database/schema/016_audit_lockdown.sql). Only migrations use the owner.
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-please-32bytes+}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lemarket
      SPRING_DATASOURCE_USERNAME: lemarket_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-https://localhost:4200,http://localhost:4200}
      # Both web apps are HTTPS, so the session cookie is only ever sent over HTTPS.
      AUTH_COOKIE_SECURE: "true"
      LMJ_AUTH_LOCKOUT_DURATION: ${AUTH_LOCKOUT_DURATION:-15m}
      # BR-03: an idle session ends after this (ISO-8601). Test runs that pause longer than a minute
      # without input (the e2e and load suites, Jenkins) set SESSION_INACTIVITY_TIMEOUT=PT30M.
      LMJ_SESSION_INACTIVITYTIMEOUT: ${SESSION_INACTIVITY_TIMEOUT:-PT1M}

  # Order placement, lifecycle, automatic execution and history, and the Trading Ops trade search
  # and order timeline. Publishes the order events to Kafka.
  orders-service:
    image: lemarketjames/orders-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    ports:
      # Published for direct debugging and the e2e execution control only; browser traffic goes
      # through a web app.
      # This machine only (BR-02): another computer can't reach it. A shared VM that other machines
      # develop against sets SERVICE_BIND_ADDRESS=0.0.0.0 (README, "Running the Frontend Against a Remote Backend").
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:8085:8085"
    depends_on:
      db:
        condition: service_healthy
      # Its prices come from trading-service. trading-service doesn't wait on this service in
      # turn, though it reads orders back from it: both clients are lazy (called only on an
      # actual request), so a cycle of waits isn't needed.
      trading-service:
        condition: service_started
      # It creates the order event topics when it starts, so the broker must be answering first.
      kafka:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-please-32bytes+}
      # orders-service calls trading-service's /internal/**, which needs this shared token (BR-02, C5).
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-this-development-only-internal-token}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lemarket
      SPRING_DATASOURCE_USERNAME: lemarket_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}
      # Prices (/api/market/**) and settlement (/internal/holdings/**) both live in trading-service.
      MARKET_SERVICE_URL: http://trading-service:8084
      HOLDINGS_SERVICE_URL: http://trading-service:8084
      # Order events go to the broker below instead of only being logged (contracts/C6-api.md).
      # Without this setting the service uses its stub publisher and needs no broker.
      LMJ_EVENTS_PUBLISHER: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LMJ_EXECUTION_RESPECT_MARKET_HOURS: ${SIM_RESPECT_MARKET_HOURS:-true}
      LMJ_EXECUTION_HOLIDAYS: ${SIM_HOLIDAYS:-}
      LMJ_EXECUTION_CONTROL_ENABLED: "true"
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-https://localhost:4200,http://localhost:4200}

  # Everything a client trades against apart from the orders themselves: the simulated market
  # (GBM engine), instruments, quotes and sessions, the client profile, holdings, portfolio and
  # trade history, and two Kafka consumers: a client's order notifications (from
  # lemarket.orders.status-changed) and the traded volume per stock (from lemarket.orders.filled).
  # Settles fills for orders-service (POST /internal/holdings/settle, never routed by a web app)
  # and reads order data back from it for trade history and buying power.
  trading-service:
    image: lemarketjames/trading-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/trading-service/Dockerfile
    ports:
      # Published for direct debugging and the e2e test controls only; browser traffic goes
      # through a web app.
      # This machine only (BR-02): another computer can't reach it. A shared VM that other machines
      # develop against sets SERVICE_BIND_ADDRESS=0.0.0.0 (README, "Running the Frontend Against a Remote Backend").
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:8084:8084"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-please-32bytes+}
      # orders-service calls trading-service's /internal/**, which needs this shared token (BR-02, C5).
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-this-development-only-internal-token}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lemarket
      SPRING_DATASOURCE_USERNAME: lemarket_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}
      ORDERS_SERVICE_URL: http://orders-service:8085
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-https://localhost:4200,http://localhost:4200}
      # This stack is a test environment, so the quote-feed test controls (contract C4,
      # contracts/C4-quote-feed.md) and the settlement test control (contracts/C5-config.md) are
      # on. They sit under /internal on port 8084, which no web app forwards.
      SIM_CONTROL_ENABLED: "true"
      LMJ_SETTLEMENT_CONTROL_ENABLED: "true"
      SIM_RESPECT_MARKET_HOURS: ${SIM_RESPECT_MARKET_HOURS:-true}
      SIM_HOLIDAYS: ${SIM_HOLIDAYS:-}
      # Listen to the order events on the broker below (contracts/C5-config.md). Without this
      # setting the service starts no listener and needs no broker.
      LMJ_EVENTS_CONSUMER: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  # Analyst reports (/api/v1/reports/**, built on the reporting_trades view) and Trading Ops'
  # surveillance alerts (/api/v1/surveillance/alerts), raised on each large order and each refused
  # settlement from lemarket.orders.submitted and lemarket.orders.status-changed. Only the staff
  # app routes to it. It shares the database with live trading, so reports read through a pool of
  # their own that is small, read-only and time-limited; see the read-side safeguards in
  # services/staff-ops-service/src/main/resources/application.properties.
  staff-ops-service:
    image: lemarketjames/staff-ops-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/staff-ops-service/Dockerfile
    ports:
      # Published for direct debugging and tests only; staff browser traffic goes through the staff app.
      # This machine only (BR-02): another computer can't reach it. A shared VM that other machines
      # develop against sets SERVICE_BIND_ADDRESS=0.0.0.0 (README, "Running the Frontend Against a Remote Backend").
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:8086:8086"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # orders-service creates the topics when it starts. A consumer that is up first only waits
      # for them, so this is about a quiet log, not correctness.
      orders-service:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-please-32bytes+}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lemarket
      SPRING_DATASOURCE_USERNAME: lemarket_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}
      # Listen to the order events on the broker below (contracts/C5-config.md). Without this
      # setting the service starts no listener and needs no broker.
      LMJ_EVENTS_CONSUMER: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  # Message broker for order events (LMKT-137): orders-service publishes OrderSubmitted,
  # OrderStatusChanged and OrderFilled to it, and the consumers in trading-service and
  # staff-ops-service read them (contracts/C6-api.md). One node in KRaft mode, acting as broker and controller at once, so
  # there is no ZooKeeper.
  # The topics are not listed here: orders-service declares them from the names in its
  # OrderEventForwarder and creates them when it starts. The broker's own auto-creation is off, so
  # a mistyped topic name fails instead of quietly making a new topic.
  # Events are disposable test data, so there is no volume; removing this container removes them,
  # and the topics come back the next time orders-service starts.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      # For clients on the host: Jenkins' integration tests and a service run outside Docker.
      # Containers use kafka:29092 instead. No other service in this file uses 9092.
      # This machine only (BR-02): another computer can't reach it. A shared VM that other machines
      # develop against sets SERVICE_BIND_ADDRESS=0.0.0.0 (README, "Running the Frontend Against a Remote Backend").
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # A client is sent on to the address the listener it reached advertises. So there is one
      # listener per kind of client: INTERNAL advertises the Compose name, EXTERNAL advertises
      # localhost on the published port. CONTROLLER (9093) is the node talking to itself and is
      # not published.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Kafka's internal topics default to three copies, which a single node can't hold.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # A consumer group with one member needn't wait for others to join: each consumer group
      # (one per consuming feature) has a single member.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The default heap is 1 GB, far more than a test stack's few events need.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      # Healthy once the broker answers a client, not merely once the port is open.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  db:
    image: postgres:16-alpine
    # The server log is the record of every refused attempt to change an audit record
    # (contracts/C2-audit.md). A failed statement is logged by default; the prefix adds who ran it
    # and from where, and DDL is logged so that switching a trigger off shows up too.
    # scripts/verify-audit-lockdown.sh reads the user= part; change them together.
    command:
      - postgres
      - -c
      - "log_line_prefix=%m [%p] %quser=%u db=%d app=%a client=%h "
      - -c
      - log_statement=ddl
    healthcheck:
      # TCP readiness waits until initial schema scripts have completed.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lemarket -d lemarket"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      POSTGRES_DB: lemarket
      POSTGRES_USER: lemarket
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      # Password of lemarket_app, the restricted account 016_audit_lockdown.sql creates. Read by
      # psql inside this container, both on first start and when Jenkins re-applies the schema.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}
    ports:
      # Db is reachable from the host too, for DBA tooling on the developer's
      # machine during development (the web apps never call db directly; only the backend
      # services talk to it).
      # This machine only (BR-02): another computer can't reach it. A shared VM that other machines
      # develop against sets SERVICE_BIND_ADDRESS=0.0.0.0 (README, "Running the Frontend Against a Remote Backend").
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d

  # BR-14: a nightly pg_dump of the database, keeping the newest few, in the db_backups volume. The
  # same scripts/backup-db.sh as a manual backup; restore steps in database/README.md ("Backups and
  # restore"). Takes one at first start too. Same image as db, so pg_dump matches the server.
  db-backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/opt/backup/backup-db-nightly.sh"]
    environment:
      PGHOST: db
      PGDATABASE: lemarket
      # The owner: only it can read every table, including those lemarket_app may not change.
      PGUSER: lemarket
      PGPASSWORD: ${DB_PASSWORD:-changeme}
      BACKUP_DIR: /backups
      # Empty means the scripts' defaults: keep 7 (backup-db.sh), at 02:00 UTC (backup-db-nightly.sh).
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      BACKUP_TIME: ${BACKUP_TIME:-}
    volumes:
      - db_backups:/backups
      - ./scripts/backup-db.sh:/opt/backup/backup-db.sh:ro
      - ./scripts/backup-db-nightly.sh:/opt/backup/backup-db-nightly.sh:ro

volumes:
  db_data:
    # Named volume: persists Postgres data across `docker compose down` and
    # `docker compose up`. Use `docker compose down -v` to also remove this
    # volume, which wipes the database and starts fresh on the next `up`.
  db_backups:
    # The nightly backups (db-backup above). Kept by `docker compose down`; `down -v` removes them
    # with the database, so copy one out first if you need it (database/README.md).
