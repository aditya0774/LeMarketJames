services:
  frontend:
    image: lemarketjames/frontend:${IMAGE_TAG:-dev}
    build: ./apps/frontend
    ports:
      - "4200:80"
    depends_on:
      - gateway-service

  # The staff app (Trading Ops and Analyst): a separate Angular app on its own port. It builds from
  # the same Angular workspace as the trading frontend, hence the shared context. Its Nginx
  # forwards /api to staff-gateway-service:8090 (apps/frontend/projects/staff/nginx.conf), its
  # only backend entry point; it never calls the trading gateway.
  staff-frontend:
    image: lemarketjames/staff-frontend:${IMAGE_TAG:-dev}
    build:
      context: ./apps/frontend
      dockerfile: projects/staff/Dockerfile
    ports:
      - "4201:80"
    depends_on:
      - gateway-service

  # Single entry point for the frontend: routes /api/auth/** to auth-service, /api/market/** to
  # market-service, /api/v1/{holdings,profile,portfolio,trades}/** to holdings-service, and
  # /api/v1/{orders,buy-orders}/** to buy-sell-service, everything else to core-service (see
  # services/gateway-service/src/main/resources/application.yml).
  gateway-service:
    image: lemarketjames/gateway-service:${IMAGE_TAG:-dev}
    build:
      # Backend images build from the repo root so Maven can see the parent pom and libs/common.
      context: .
      dockerfile: services/gateway-service/Dockerfile
    ports:
      - "8089:8080"
    depends_on:
      - auth-service
      - core-service
      - market-service
      - holdings-service
      - buy-sell-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8082
      BUY_SELL_SERVICE_URL: http://buy-sell-service:8085
      CORE_SERVICE_URL: http://core-service:8081
      MARKET_SERVICE_URL: http://market-service:8083
      HOLDINGS_SERVICE_URL: http://holdings-service:8084
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:4200}

  # Single entry point for the staff app (LMKT-143). It is the gateway image above started with
  # the "staff" profile, which swaps in the staff routes: /api/v1/reports/** to reporting-service,
  # sign-in, sign-out and /me to auth-service, and the Trading Ops trade search and order
  # timeline to buy-sell-service; nothing else is routed (see
  # services/gateway-service/src/main/resources/application-staff.yml). The browser's session
  # cookie here is staff_jwt, so a staff and a customer session can share a browser
  # (contracts/C7-roles.md).
  staff-gateway-service:
    image: lemarketjames/gateway-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    ports:
      - "8090:8090"
    depends_on:
      - auth-service
      - buy-sell-service
      - reporting-service
    environment:
      SPRING_PROFILES_ACTIVE: staff
      AUTH_SERVICE_URL: http://auth-service:8082
      BUY_SELL_SERVICE_URL: http://buy-sell-service:8085
      REPORTING_SERVICE_URL: http://reporting-service:8086
      STAFF_CORS_ALLOWED_ORIGIN: ${STAFF_CORS_ALLOWED_ORIGIN:-http://localhost:4201}

  # auth-service and core-service share the same database and the same JWT_SECRET, so a token
  # issued by auth-service is accepted by core-service.
  auth-service:
    image: lemarketjames/auth-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      # Published for direct debugging only; browser traffic goes through the gateway.
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development defaults for the disposable testing stack; environment overrides remain supported.
      # Every service logs in as lemarket_app, the restricted account that can't change or delete
      # audit records (database/schema/016_audit_lockdown.sql). Only migrations use the owner.
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-please-32bytes+}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lemarket
      SPRING_DATASOURCE_USERNAME: lemarket_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:4200}

  core-service:
    image: lemarketjames/core-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/core-service/Dockerfile
    ports:
      # Published for direct debugging only; browser traffic goes through the gateway.
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      market-service:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-please-32bytes+}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lemarket
      SPRING_DATASOURCE_USERNAME: lemarket_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}
      MARKET_SERVICE_URL: http://market-service:8083
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:4200}

  buy-sell-service:
    image: lemarketjames/buy-sell-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/buy-sell-service/Dockerfile
    ports:
      # Published for direct debugging only; browser traffic goes through the gateway.
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy
      market-service:
        condition: service_started
      # It creates the order event topics when it starts, so the broker must be answering first.
      kafka:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-please-32bytes+}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lemarket
      SPRING_DATASOURCE_USERNAME: lemarket_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}
      MARKET_SERVICE_URL: http://market-service:8083
      # Order events go to the broker below instead of only being logged (contracts/C6-api.md).
      # Without this setting the service uses its stub publisher and needs no broker.
      LMJ_EVENTS_PUBLISHER: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LMJ_EXECUTION_RESPECT_MARKET_HOURS: ${SIM_RESPECT_MARKET_HOURS:-true}
      LMJ_EXECUTION_HOLIDAYS: ${SIM_HOLIDAYS:-}
      # No depends_on here: buy-sell-service calls holdings-service (settlement) and holdings-service
      # calls buy-sell-service (reading orders) — a real dependency cycle, so neither can wait on the
      # other's startup via Compose. Both clients are lazy (called only on an actual request), so
      # this only matters if a request arrives before both containers are ready.
      HOLDINGS_SERVICE_URL: http://holdings-service:8084
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:4200}

  # Simulated market prices (GBM engine), called server-to-server by core-service and
  # holdings-service; no JWT_SECRET needed since it never sees a browser's cookie and serves no
  # user-specific data.
  market-service:
    image: lemarketjames/market-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/market-service/Dockerfile
    ports:
      # Published for direct debugging only; browser traffic goes through the gateway.
      - "8083:8083"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lemarket
      SPRING_DATASOURCE_USERNAME: lemarket_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}
      # This stack is a test environment, so the quote-feed test controls are on (contract C4,
      # contracts/C4-quote-feed.md). They sit under /internal on port 8083, never behind the gateway.
      SIM_CONTROL_ENABLED: "true"
      SIM_RESPECT_MARKET_HOURS: ${SIM_RESPECT_MARKET_HOURS:-true}
      SIM_HOLIDAYS: ${SIM_HOLIDAYS:-}

  # Client profile, holdings, portfolio, and trade history. Settles fills for buy-sell-service
  # (POST /internal/holdings/settle, never routed through the gateway) and reads order data back
  # from buy-sell-service for trade history/buying power.
  holdings-service:
    image: lemarketjames/holdings-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/holdings-service/Dockerfile
    ports:
      # Published for direct debugging only; browser traffic goes through the gateway.
      - "8084:8084"
    depends_on:
      db:
        condition: service_healthy
      market-service:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-please-32bytes+}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lemarket
      SPRING_DATASOURCE_USERNAME: lemarket_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}
      MARKET_SERVICE_URL: http://market-service:8083
      ORDERS_SERVICE_URL: http://buy-sell-service:8085
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:4200}

  # Aggregate, read-only reports for analysts (/api/v1/reports/**). The trading gateway has no
  # route to it on purpose: the staff gateway routes staff requests to it. It shares the
  # database with live trading, so its connections are few, read-only and time-limited; see the
  # read-side safeguards in services/reporting-service/src/main/resources/application.properties.
  reporting-service:
    image: lemarketjames/reporting-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/reporting-service/Dockerfile
    ports:
      # Published for direct debugging and tests only; staff browser traffic goes through the staff gateway.
      - "8086:8086"
    depends_on:
      db:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-please-32bytes+}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lemarket
      SPRING_DATASOURCE_USERNAME: lemarket_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}

  # Message broker for order events (LMKT-137): buy-sell-service publishes OrderSubmitted,
  # OrderStatusChanged and OrderFilled to it (contracts/C6-api.md). One node in KRaft mode, acting
  # as broker and controller at once, so there is no ZooKeeper.
  # The topics are not listed here: buy-sell-service declares them from the names in its
  # OrderEventForwarder and creates them when it starts. The broker's own auto-creation is off, so
  # a mistyped topic name fails instead of quietly making a new topic.
  # Events are disposable test data, so there is no volume; removing this container removes them,
  # and the topics come back the next time buy-sell-service starts.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      # For clients on the host: Jenkins' integration tests and a service run outside Docker.
      # Containers use kafka:29092 instead. No other service in this file uses 9092.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # A client is sent on to the address the listener it reached advertises. So there is one
      # listener per kind of client: INTERNAL advertises the Compose name, EXTERNAL advertises
      # localhost on the published port. CONTROLLER (9093) is the node talking to itself and is
      # not published.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Kafka's internal topics default to three copies, which a single node can't hold.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # A consumer group with one member needn't wait for others to join.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The default heap is 1 GB, far more than a test stack's few events need.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      # Healthy once the broker answers a client, not merely once the port is open.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  db:
    image: postgres:16-alpine
    # The server log is the record of every refused attempt to change an audit record
    # (contracts/C2-audit.md). A failed statement is logged by default; the prefix adds who ran it
    # and from where, and DDL is logged so that switching a trigger off shows up too.
    # scripts/verify-audit-lockdown.sh reads the user= part; change them together.
    command:
      - postgres
      - -c
      - "log_line_prefix=%m [%p] %quser=%u db=%d app=%a client=%h "
      - -c
      - log_statement=ddl
    healthcheck:
      # TCP readiness waits until initial schema scripts have completed.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lemarket -d lemarket"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      POSTGRES_DB: lemarket
      POSTGRES_USER: lemarket
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      # Password of lemarket_app, the restricted account 016_audit_lockdown.sql creates. Read by
      # psql inside this container, both on first start and when Jenkins re-applies the schema.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}
    ports:
      # Db is reachable from the host too, for DBA tooling on the developer's
      # machine during development (the frontend and gateway never call db directly;
      # only the backend services other than the gateway talk to it).
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d

volumes:
  db_data:
    # Named volume: persists Postgres data across `docker compose down` and
    # `docker compose up`. Use `docker compose down -v` to also remove this
    # volume, which wipes the database and starts fresh on the next `up`.
