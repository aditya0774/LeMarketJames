# CI-only overlay: Jenkins applies it on top of docker-compose.yml through COMPOSE_FILE (see the
# Jenkinsfile). It changes no behaviour, only how much of the agent the stack takes. Not for
# local use; `docker compose up` on a developer's machine reads docker-compose.yml alone.
#
# The Jenkins agent has 2 CPUs and under 8 GB of memory with no swap, shared with SonarQube and
# Jenkins itself. Left to its defaults every JVM below may grow its heap to a quarter of that, and
# eleven of them next to Kafka, PostgreSQL and the Playwright browsers leave the machine no file
# cache: it then freezes for half a minute at a time and the browser tests time out.
#
#   -XX:TieredStopAtLevel=1  the JIT's quick first tier only. These JVMs live for one build and
#                            serve a few hundred requests; the optimising tier would cost CPU
#                            during start-up, when all eleven start at once, and never pay it back.
#   -XX:+UseSerialGC         the collector with the smallest footprint. On a 2-CPU machine the
#                            default one adds threads and memory that a heap this small has no use for.
#   -Xmx                     a ceiling on the heap. If a service ever fails here with
#                            OutOfMemoryError, raise its figure; don't remove the cap.
x-jvm: &jvm "-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xmx384m"
# The three Kafka consumers are small; 256m is the cap docker-compose.yml already gives them.
x-small-jvm: &small-jvm "-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xmx256m"

services:
  gateway-service:
    environment:
      JAVA_TOOL_OPTIONS: *jvm

  staff-gateway-service:
    environment:
      JAVA_TOOL_OPTIONS: *jvm

  auth-service:
    environment:
      JAVA_TOOL_OPTIONS: *jvm

  core-service:
    environment:
      JAVA_TOOL_OPTIONS: *jvm

  buy-sell-service:
    environment:
      JAVA_TOOL_OPTIONS: *jvm

  market-service:
    environment:
      JAVA_TOOL_OPTIONS: *jvm

  holdings-service:
    environment:
      JAVA_TOOL_OPTIONS: *jvm

  reporting-service:
    environment:
      JAVA_TOOL_OPTIONS: *jvm

  notification-service:
    environment:
      JAVA_TOOL_OPTIONS: *small-jvm

  surveillance-service:
    environment:
      JAVA_TOOL_OPTIONS: *small-jvm

  activity-service:
    environment:
      JAVA_TOOL_OPTIONS: *small-jvm

  kafka:
    environment:
      # The broker creates its consumer-offsets topic when the first consumer group joins, with
      # 50 partitions by default. On this agent that took long enough for the three consumers to
      # spin on NOT_COORDINATOR just as the browser tests began. One partition is all a single
      # node with three small groups needs, and it is ready at once.
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
